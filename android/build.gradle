group 'com.example.fb_ali_pay'
version '1.0'

buildscript {
    repositories {
        flatDir {
            dirs 'libs'
        }
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        minSdkVersion 16
    }

    repositories  {
        flatDir{ dirs 'libs' }
    }
}

dependencies {
    implementation fileTree(include: ['*.aar'], dir: 'libs')
}

// Workaround for AGP 7.4+ local .aar restriction
tasks.configureEach { task ->
    if (task.name.contains("bundleDebugAar") || task.name.contains("bundleReleaseAar")) {
        task.enabled = false
    }
}
